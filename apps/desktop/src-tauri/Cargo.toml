[package]
name = "logic-socket-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "lsock_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
lsock-core.workspace = true
lsock-engine.workspace = true
lsock-mcp.workspace = true
lsock-templating.workspace = true
lsock-runner.workspace = true
lsock-llm.workspace = true
lsock-realtime.workspace = true
lsock-grpc.workspace = true
lsock-convert.workspace = true
reqwest.workspace = true
prost-reflect = "0.16"
futures.workspace = true
tauri = { version = "2", features = [] }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true

[dev-dependencies]
lsock-grpc.workspace = true
lsock-realtime.workspace = true
lsock-llm.workspace = true
tempfile.workspace = true
tauri = { version = "2", features = ["test"] }
lsock-mcp.workspace = true
axum.workspace = true
futures.workspace = true
tower-http = { version = "0.6", features = ["cors"] }
