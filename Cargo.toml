[workspace]
resolver = "3"
members = [
  "crates/core",
  "crates/templating",
  "crates/http",
  "crates/mcp",
  "crates/engine",
  "crates/scripting",
  "crates/runner",
  "crates/llm",
  "crates/realtime",
  "crates/grpc",
  "crates/convert",
  "crates/cli",
  "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.4"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
lsock-core = { path = "crates/core" }
lsock-templating = { path = "crates/templating" }
lsock-http = { path = "crates/http" }
lsock-mcp = { path = "crates/mcp" }
lsock-engine = { path = "crates/engine" }
lsock-scripting = { path = "crates/scripting" }
lsock-runner = { path = "crates/runner" }
lsock-llm = { path = "crates/llm" }
lsock-realtime = { path = "crates/realtime" }
lsock-grpc = { path = "crates/grpc" }
lsock-convert = { path = "crates/convert" }

tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "multipart", "stream", "gzip", "brotli", "deflate", "zstd"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
minijinja = { version = "2", features = ["loader", "json", "urlencode"] }
rusqlite = { version = "0.40", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
base64 = "0.22"
url = "2"
futures = "0.3"
indexmap = { version = "2", features = ["serde"] }
tempfile = "3"
axum = "0.8"
rquickjs = { version = "0.14", features = ["futures", "parallel", "loader"] }
csv = "1"
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
keyring = { version = "3", features = ["apple-native", "windows-native"] }

# Lighter debug builds: file/line info for backtraces, without full debug info
# for every dependency (keeps target/ a fraction of the size).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
