[workspace]
resolver = "3"
members = [
  "crates/core",
  "crates/templating",
  "crates/http",
  "crates/mcp",
  "crates/engine",
  "crates/scripting",
  "crates/runner",
  "crates/cli",
  "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
irs-core = { path = "crates/core" }
irs-templating = { path = "crates/templating" }
irs-http = { path = "crates/http" }
irs-mcp = { path = "crates/mcp" }
irs-engine = { path = "crates/engine" }
irs-scripting = { path = "crates/scripting" }
irs-runner = { path = "crates/runner" }

tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "multipart", "stream", "gzip", "brotli", "deflate", "zstd"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
minijinja = { version = "2", features = ["loader", "json", "urlencode"] }
rusqlite = { version = "0.40", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
base64 = "0.22"
url = "2"
futures = "0.3"
indexmap = { version = "2", features = ["serde"] }
tempfile = "3"
axum = "0.8"
rquickjs = { version = "0.14", features = ["futures", "parallel"] }
csv = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
